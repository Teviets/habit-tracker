services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: florece
      POSTGRES_USER: florece
      POSTGRES_PASSWORD: florece
    ports:
      - "5432:5432"
    volumes:
      - florece_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florece -d florece"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://florece:florece@postgres:5432/florece
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://florece:florece@postgres:5432/florece
      JWT_SECRET: change-this-secret-before-production-123456
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  florece_postgres:
